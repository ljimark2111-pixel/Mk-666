<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የምዝገባ ቅጽ</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #334155;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
      display: flex;      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }

    .form-title {
      text-align: center;
      color: var(--primary);
      margin-bottom: 25px;
      font-size: 22px;
      font-weight: bold;
    }

    .section-title {
      color: var(--primary);
      font-size: 16px;
      margin: 20px 0 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .input-box { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
    .required { color: #ef4444; }

    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: white;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus, input[type="tel"]:focus {
      border-color: var(--primary);
    }

    /* Custom File Upload Box */
    .file-upload {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      background-color: var(--input-bg);
      cursor: pointer;
      transition: 0.3s;
    }

    .file-upload:hover { border-color: var(--primary); }
    .file-upload i { font-size: 24px; color: var(--primary); margin-bottom: 5px; }
    .file-upload span { display: block; font-size: 13px; color: var(--text-muted); }
    .file-upload input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* Bank Details Box */
    .payment-box {
      background-color: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .bank-details p { margin-top: 4px; color: var(--text-muted); }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .submit-btn:hover { background-color: var(--primary-hover); }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-title"><i class="fa-solid fa-user-plus"></i> የምዝገባ ቅጽ</div>

    <form id="regForm">
      <!-- የግል መረጃ -->
      <div class="section-title"><i class="fa-solid fa-id-card"></i> የግል መረጃ</div>

      <div class="input-box">
        <label>ስም <span class="required">*</span></label>
        <input type="text" name="firstName" placeholder="ስምዎን ያስገቡ" required>
      </div>

      <div class="input-box">
        <label>የአባት ስም <span class="required">*</span></label>
        <input type="text" name="fatherName" placeholder="የአባት ስም ያስገቡ" required>
      </div>

      <div class="input-box">
        <label>የአያት ስም <span class="required">*</span></label>
        <input type="text" name="grandFatherName" placeholder="የአያት ስም ያስገቡ" required>
      </div>

      <div class="input-box">
        <label>ስልክ ቁጥር <span class="required">*</span></label>
        <input type="tel" name="phoneNumber" placeholder="09..." required>
      </div>

      <!-- የመታወቂያ ፎቶዎች -->
      <div class="section-title"><i class="fa-solid fa-file-image"></i> የመታወቂያ መረጃ</div>

      <div class="input-box">
        <label>የመታወቂያ ፊት ገፅ <span class="required">*</span></label>
        <div class="file-upload">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span id="label-id-front">የፊቱን ፎቶ እዚህ ያስገቡ</span>
          <input type="file" name="id_front" accept="image/*" onchange="updateFileName(this, 'label-id-front')" required>
        </div>
      </div>

      <div class="input-box">
        <label>የመታወቂያ ጀርባ ገፅ <span class="required">*</span></label>
        <div class="file-upload">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span id="label-id-back">የጀርባውን ፎቶ እዚህ ያስገቡ</span>
          <input type="file" name="id_back" accept="image/*" onchange="updateFileName(this, 'label-id-back')" required>
        </div>
      </div>

      <!-- የክፍያ መረጃ -->
      <div class="section-title"><i class="fa-solid fa-wallet"></i> የክፍያ መረጃ</div>

      <div class="payment-box">
        <p><strong><i class="fa-solid fa-building-columns"></i> የባንክ አካውንት መረጃ:</strong></p>
        <div class="bank-details">
          <p><i class="fa-solid fa-credit-card"></i> CBE: 1000xxxxxxxxx</p>
          <p><i class="fa-solid fa-mobile-screen"></i> Telebirr: 09xxxxxxxx</p>
        </div>
      </div>

      <div class="input-box">
        <label>የክፍያ ስክሪንሾት (Receipt) <span class="required">*</span></label>
        <div class="file-upload">
          <i class="fa-solid fa-receipt"></i>
          <span id="label-receipt">የከፈሉበትን Receipt/Screenshot ያስገቡ</span>
          <input type="file" name="receipt" accept="image/*" onchange="updateFileName(this, 'label-receipt')" required>
        </div>
      </div>

      <button type="submit" class="submit-btn">
        <i class="fa-solid fa-paper-plane"></i> ምዝገባውን ላክ
      </button>
    </form>
  </div>

    <script>
    function updateFileName(input, labelId) {
      if (input.files && input.files[0]) {
        document.getElementById(labelId).innerText = "✅ " + input.files[0].name;
      }
    }

    document.getElementById('regForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const submitBtn = this.querySelector('.submit-btn');
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> መረጃው እየተላከ ነው...';
        submitBtn.disabled = true;

        const formData = new FormData(this);

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                // መረጃው ለቴሌግራም በስኬት ከተላከ በኋላ ብቻ ነው ውሳኔ የሚጠብቀው
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> መረጃዎ በመገምገም ላይ ነው...';
                
                const userId = result.userId;
                
                // ሰርቨሩን መጠየቅ የሚጀምረው ከ 5 ሰከንድ በኋላ ነው (ቦቱ ጋር ደርሶ አንተ እንድታየው ጊዜ ለመስጠት)
                setTimeout(() => {
                    const checkInterval = setInterval(async () => {
                        try {
                            const statusRes = await fetch(`/api/status/${userId}`);
                            const statusData = await statusRes.json();

                            if (statusData.status === 'approved') {
                                clearInterval(checkInterval);
                                alert('🎉 ምዝገባዎ ተጸድቋል!');
                                window.location.href = '/home.html';
                            } else if (statusData.status === 'rejected') {
                                clearInterval(checkInterval);
                                alert('⚠️ የላኩት ፋይል ወይም መረጃ የተሳሳተ ነው። እባክዎ ትክክለኛ መረጃ እና ፎቶዎችን አዘጋጅተው ድጋሚ ይሙሉ!');
                                location.reload();
                            }
                        } catch (err) {
                            console.error('Status check error:', err);
                        }
                    }, 3000); // በየ 3 ሰከንዱ ያረጋግጣል
                }, 2000);

            } else {
                alert('ስህተት አለ፣ እባክዎ ድጋሚ ይሞክሩ።');
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ምዝገባውን ላክ';
                submitBtn.disabled = false;
            }
        } catch (error) {
            console.error(error);
            alert('እባክዎ የኢንተርኔት ኮኔክሽንዎን አረጋግጠው ድጋሚ ይሞክሩ!');
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ምዝገባውን ላክ';
            submitBtn.disabled = false;
        }
    });
    </script>
  
</body>
</html>
