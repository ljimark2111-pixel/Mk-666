<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የምዝገባ ቅጽ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .form-container {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 10px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h2 { text-align: center; color: #4CAF50; }
    .input-box { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="tel"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #333;
      background-color: #2b2b2b;
      color: white;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background-color: #45a049; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>የምዝገባ ቅጽ</h2>
    
    <form id="regForm">
      <div class="input-box">
        <label>ሙሉ ስም:</label>
        <input type="text" name="fullName" placeholder="ስምዎን ያስገቡ" required>
      </div>

      <div class="input-box">
        <label>ስልክ ቁጥር:</label>
        <input type="tel" name="phoneNumber" placeholder="09..." required>
      </div>

      <div class="input-box">
        <label>የመታወቂያ ፊት ገፅ:</label>
        <input type="file" name="id_front" accept="image/*" required>
      </div>

      <div class="input-box">
        <label>የመታወቂያ ጀርባ ገፅ:</label>
        <input type="file" name="id_back" accept="image/*" required>
      </div>

      <div class="input-box">
        <label>የክፍያ ስክሪንሾት (Receipt):</label>
        <input type="file" name="receipt" accept="image/*" required>
      </div>

      <button type="submit">ምዝገባውን ላክ</button>
    </form>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const submitBtn = this.querySelector('button');
        submitBtn.innerText = 'እየተላከ ነው...';
        submitBtn.disabled = true;

        const formData = new FormData(this);

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                alert('ምዝገባዎ በስኬት ተልኳል!');
                this.reset();
            } else {
                alert('ስህተት አለ፣ እባክዎ ድጋሚ ይሞክሩ።');
            }
        } catch (error) {
            console.error(error);
            alert('ከሰርቨር ጋር መገናኘት አልተቻለም!');
        } finally {
            submitBtn.innerText = 'ምዝገባውን ላክ';
            submitBtn.disabled = false;
        }
    });
  </script>

</body>
</html>
