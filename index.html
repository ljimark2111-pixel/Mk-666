<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የመመዝገቢያ ገፅ | Modern Registration</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="registration-container">
        <div class="form-header">
            <i class="fa-solid fa-user-plus header-icon"></i>
            <h2>የአባልነት መመዝገቢያ Form</h2>
            <p>እባክዎን አስፈላጊዎቹን መረጃዎች በሙሉ በትክክል ይሙሉ</p>
        </div>

        <form id="registerForm">
            <!-- የግል መረጃዎች -->
            <div class="section-title">
                <i class="fa-solid fa-id-card"></i> የግል መረጃ
            </div>
            
            <div class="input-group">
                <div class="input-box">
                    <label>ስም <span class="required">*</span></label>
                    <input type="text" placeholder="ለምሳሌ፡ አበበ" required>
                </div>
                <div class="input-box">
                    <label>የአባት ስም <span class="required">*</span></label>
                    <input type="text" placeholder="ለምሳሌ፡ ከበደ" required>
                </div>
            </div>

            <div class="input-group">
                <div class="input-box">
                    <label>የአያት ስም <span class="required">*</span></label>
                    <input type="text" placeholder="ለምሳሌ፡ ተሰማ" required>
                </div>
                <div class="input-box">
                    <label>ስልክ ቁጥር <span class="required">*</span></label>
                    <input type="tel" placeholder="0911......" required>
                </div>
            </div>

            <!-- የመታወቂያ ማስገቢያ -->
            <div class="section-title">
                <i class="fa-solid fa-address-card"></i> የመታወቂያ ፎቶ (የፊት እና የጀርባ)
            </div>

            <div class="input-group">
                <div class="input-box">
                    <label>የመታወቂያ ፊት ገፅ <span class="required">*</span></label>
                    <div class="file-upload">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>የፊቱን ፎቶ እዚህ ያስገቡ</span>
                        <input type="file" accept="image/*" required>
                    </div>
                </div>
                <div class="input-box">
                    <label>የመታወቂያ ጀርባ ገፅ <span class="required">*</span></label>
                    <div class="file-upload">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>የጀርባውን ፎቶ እዚህ ያስገቡ</span>
                        <input type="file" accept="image/*" required>
                    </div>
                </div>
            </div>

            <!-- ክፍያ እና ስክሪንሾት -->
            <div class="section-title">
                <i class="fa-solid fa-wallet"></i> የክፍያ መረጃ
            </div>

            <div class="payment-box">
                <p><strong>የባንክ አካውንት መረጃ፡</strong></p>
                <div class="bank-details">
                    <p><i class="fa-solid fa-building-columns"></i> ንግድ ባንክ (CBE): <span>1000123456789</span></p>
                    <p><i class="fa-solid fa-mobile-screen"></i> Telebirr: <span>0911223344</span></p>
                </div>
            </div>

            <div class="input-box" style="margin-top: 15px;">
                <label>የክፍያ ስክሪንሾት (Payment Screenshot) <span class="required">*</span></label>
                <div class="file-upload">
                    <i class="fa-solid fa-receipt"></i>
                    <span>የከፈሉበትን Receipt/Screenshot ያስገቡ</span>
                    <input type="file" accept="image/*" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i> ምዝገባውን ጨርስ
            </button>
        </form>
    </div>
  <script>
    document.querySelector('form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = new FormData(this);

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                alert('ምዝገባዎ ተሳክቷል! መረጃዎ ደርሶናል።');
            } else {
                alert('ችግር ተፈጥሯል፣ እባክዎ ድጋሚ ይሞክሩ።');
            }
        } catch (error) {
            console.error(error);
            alert('ከሰርቨር ጋር መገናኘት አልተቻለም!');
        }
    });
  </script>
    
</body>
</html>
