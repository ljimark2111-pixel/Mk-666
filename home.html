<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>እንኳን ደህና መጡ!</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 400px;
    }
    i { color: #22c55e; font-size: 50px; margin-bottom: 15px; }
    h1 { margin-bottom: 10px; color: #22c55e; }
    p { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <i class="fa-solid fa-circle-check"></i>
    <h1>እንኳን ደህና መጡ!</h1>
    <p>ምዝገባዎ በስኬት ተጸድቋል። አሁን አገልግሎታችንን መጠቀም ይችላሉ።</p>
  </div>
</body>
</html>
